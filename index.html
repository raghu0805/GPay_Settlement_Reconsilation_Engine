<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta
      name="description"
      content="Google Pay Web Application with Razorpay Payment Gateway Test Integration."
    />
    <title>Google Pay</title>
    <!-- Razorpay Checkout JS SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body style="margin: 0; background: #f8f9fa;">
    <div id="root"></div>
    <script type="module">
      const isFileProtocol = window.location.protocol === 'file:';
      const normalizedPath = window.location.pathname.replace(/\\/g, '/');
      const isBuiltOutput = normalizedPath.includes('/dist/');

      if (isFileProtocol && !isBuiltOutput) {
        const root = document.getElementById('root');

        root.innerHTML = `
          <div style="min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: Segoe UI, sans-serif; color: #202124;">
            <div style="max-width: 680px; width: 100%; background: rgba(255,255,255,0.94); border-radius: 32px; padding: 32px; box-shadow: 0 30px 90px rgba(16,33,60,0.12);">
              <p style="margin: 0 0 12px; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #5f6368; font-weight: 700;">Google Pay Web App</p>
              <h1 style="margin: 0; font-size: 36px; line-height: 1.1;">Launch Required</h1>
              <p style="margin: 18px 0 0; font-size: 16px; line-height: 1.7; color: #5f6368;">
                Please run <code>npm run dev</code> or <code>npm run build</code> to preview the application.
              </p>
            </div>
          </div>
        `;
      } else {
        import('./src/main.jsx');
      }
    </script>
  </body>
</html>
